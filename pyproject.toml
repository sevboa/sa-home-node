[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-home-node"
version = "1.5.0"
description = "Ядро домашнего роя: ноды, службы, Telegram-бот и плагины"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "aiogram>=3.32,<3.33; python_version < '3.12'",
    "aiogram>=3.32,<4; python_version >= '3.12'",
    "aiohttp-socks>=0.9,<1",
    "aiosqlite>=0.19",
    "certifi",
    "cryptography>=42",
    "psutil>=5.9",
    "pydantic-settings>=2.2",
]

[project.scripts]
sa-home-node = "sa_home_node.cli:main"

[project.entry-points."sa_home_node.plugins"]
example = "sa_home_node.example:PLUGIN"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sa_home_node = ["**/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
